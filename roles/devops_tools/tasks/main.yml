---
# Runs after apx_container, so python3-apt, curl and unzip are already there
- name: Read the distro codename
  ansible.builtin.shell: . /etc/os-release && echo "$VERSION_CODENAME"
  register: devops_tools_codename
  changed_when: false
  check_mode: false

- name: Pick the per-distro repo suites
  ansible.builtin.set_fact:
    devops_tools_suite: "{{ devops_tools_suites[devops_tools_codename.stdout] | default({}) }}"

- name: Add the apt keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: /etc/apt/keyrings/{{ item.name }}.asc
    mode: "0644"
  loop:
    - { name: hashicorp, url: https://apt.releases.hashicorp.com/gpg }
    # Per minor release, so a version bump fetches the new key
    - { name: "kubernetes-{{ devops_tools_kubectl_minor }}", url: "https://pkgs.k8s.io/core:/stable:/v{{ devops_tools_kubectl_minor }}/deb/Release.key" }
    - { name: helm, url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey }
    - { name: google-cloud, url: https://packages.cloud.google.com/apt/doc/apt-key.gpg }
    - { name: microsoft, url: https://packages.microsoft.com/keys/microsoft.asc }
    - { name: docker, url: https://download.docker.com/linux/ubuntu/gpg }
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Add the apt repos
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: {{ item.uri }}
      Suites: {{ item.suite }}
      {% if item.components is defined %}
      Components: {{ item.components }}
      {% endif %}
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/{{ item.key | default(item.name) }}.asc
    dest: /etc/apt/sources.list.d/{{ item.name }}.sources
    mode: "0644"
  loop:
    - name: hashicorp
      uri: https://apt.releases.hashicorp.com
      suite: "{{ devops_tools_suite.hashicorp | default(devops_tools_codename.stdout) }}"
      components: main
    - name: kubernetes
      key: kubernetes-{{ devops_tools_kubectl_minor }}
      uri: https://pkgs.k8s.io/core:/stable:/v{{ devops_tools_kubectl_minor }}/deb/
      # Flat repo: no components
      suite: /
    - name: helm
      uri: https://packages.buildkite.com/helm-linux/helm-debian/any/
      suite: any
      components: main
    - name: google-cloud
      uri: https://packages.cloud.google.com/apt
      suite: cloud-sdk
      components: main
    - name: azure-cli
      key: microsoft
      uri: https://packages.microsoft.com/repos/azure-cli/
      suite: "{{ devops_tools_suite['azure-cli'] | default(devops_tools_codename.stdout) }}"
      components: main
    - name: docker
      uri: https://download.docker.com/linux/{{ devops_tools_docker_os[devops_tools_codename.stdout] | default('ubuntu') }}
      suite: "{{ devops_tools_suite.docker | default(devops_tools_codename.stdout) }}"
      components: stable
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Install the DevOps packages
  ansible.builtin.apt:
    name: "{{ devops_tools_packages + devops_tools_hashicorp + devops_tools_cloud_clis + devops_tools_docker_packages + ['kubectl', 'helm'] }}"
    update_cache: true
  become: true
  when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

# AWS CLI v2 isn't packaged; AWS's installer puts it in /usr/local/aws-cli. Rerun with
# -e devops_tools_aws_update=true to update it
- name: Check for the AWS CLI
  ansible.builtin.stat:
    path: /usr/local/bin/aws
  register: devops_tools_aws

- name: Install the AWS CLI
  ansible.builtin.shell: |
    set -e
    dir=$(mktemp -d)
    trap 'rm -rf "$dir"' EXIT
    curl -fsSL -o "$dir/awscliv2.zip" https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    unzip -q "$dir/awscliv2.zip" -d "$dir"
    "$dir/aws/install" --update
  when: not devops_tools_aws.stat.exists or (devops_tools_aws_update | default(false) | bool)
  changed_when: true
  become: true

# A context (in ~/.docker) rather than DOCKER_HOST, so non-interactive shells get it too
- name: Check for the host podman docker context
  ansible.builtin.command: docker context inspect host-podman
  register: devops_tools_docker_context
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the host podman docker context
  ansible.builtin.command: docker context create host-podman --docker host={{ devops_tools_docker_host }}
  register: devops_tools_docker_create
  when: devops_tools_docker_context.rc != 0
  changed_when: true
  # apx-ansible and apx-vso-native share the host $HOME and run in parallel
  failed_when: devops_tools_docker_create.rc != 0 and 'already exists' not in devops_tools_docker_create.stderr

- name: Use the host podman docker context
  ansible.builtin.command: docker context use host-podman
  register: devops_tools_docker_use
  changed_when: false
  when: not ansible_check_mode

# podman has no BuildKit of its own, so `docker build` runs BuildKit in a container on the
# host podman; default-load puts the built image into podman like a plain docker build
- name: Check for the podman BuildKit builder
  ansible.builtin.command: docker buildx inspect podman-buildkit
  register: devops_tools_buildx
  changed_when: false
  failed_when: false
  check_mode: false

- name: Create the podman BuildKit builder
  ansible.builtin.command: >-
    docker buildx create --name podman-buildkit --driver docker-container
    --driver-opt default-load=true host-podman
  register: devops_tools_buildx_create
  when: devops_tools_buildx.rc != 0
  changed_when: true
  failed_when: devops_tools_buildx_create.rc != 0 and 'existing instance' not in devops_tools_buildx_create.stderr

- name: Use the podman BuildKit builder
  ansible.builtin.command: docker buildx use --default podman-buildkit
  changed_when: false
  when: not ansible_check_mode

# Plain `docker build` always takes the builder named after the context (host-podman, which
# buildx makes without default-load); the builder alias sends it through `docker buildx
# build`, which takes podman-buildkit
- name: Check for the docker builder alias
  ansible.builtin.shell: >-
    grep -q '"builder": "buildx"' ~/.docker/config.json
  register: devops_tools_builder_alias
  changed_when: false
  failed_when: false
  check_mode: false

# `install` is deprecated, but it's the only command that writes the alias
- name: Route docker build through buildx
  ansible.builtin.command: docker buildx install
  when: devops_tools_builder_alias.rc != 0
  changed_when: true
