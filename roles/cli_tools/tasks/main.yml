---
# Static binaries in ~/.local/bin, shared by the host and every apx container (same $PATH entry
# via bash_aliases). Each release is unpacked once into a versioned cache dir, so bumping a
# version in vars.yml is what triggers a reinstall.
- name: Create tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ local_home }}/.local/bin"

- name: Create a cache directory per tool version
  ansible.builtin.file:
    path: "{{ cli_tools_cache }}/{{ item.name }}-{{ item.version }}"
    state: directory
    mode: "0755"
  loop: "{{ cli_tools }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  # Cache only: done for real in --check too, so the binary copies below can be compared
  check_mode: false

- name: Unpack tool releases
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: "{{ cli_tools_cache }}/{{ item.name }}-{{ item.version }}"
    remote_src: true
    creates: "{{ cli_tools_cache }}/{{ item.name }}-{{ item.version }}/{{ item.member }}"
  loop: "{{ cli_tools }}"
  loop_control:
    label: "{{ item.name }} {{ item.version }}"
  check_mode: false

- name: Install tool binaries
  ansible.builtin.copy:
    src: "{{ cli_tools_cache }}/{{ item.name }}-{{ item.version }}/{{ item.member }}"
    dest: "{{ local_home }}/.local/bin/{{ item.name }}"
    remote_src: true
    mode: "0755"
  loop: "{{ cli_tools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install btop themes
  ansible.builtin.copy:
    src: "{{ cli_tools_cache }}/btop-{{ item.version }}/btop/themes/"
    dest: "{{ local_home }}/.local/share/btop/themes/"
    remote_src: true
    mode: "0644"
  loop: "{{ cli_tools | selectattr('name', '==', 'btop') }}"
  loop_control:
    label: btop {{ item.version }}

# ble.sh (fish-style suggestions for bash) was tried and dropped; clean up an old install
- name: Remove ble.sh
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ local_home }}/.local/share/blesh"
    - "{{ local_home }}/.cache/blesh"
