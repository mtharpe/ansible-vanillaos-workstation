---
desktop_extensions_dir: "{{ local_home }}/.local/share/gnome-shell/extensions"
desktop_keybinding_path: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings

# Busy cursor names (incl. the legacy X11 hash names) that Adwaita-NoBusy maps to the arrow
desktop_busy_cursors:
  - wait
  - watch
  - progress
  - left_ptr_watch
  - half-busy
  - 08e8e1c95fe2fc01f976f1e063a24ccd
  - 3ecb610c1bf2410f44200f48c40d3599
  - 00000000000000020006000e7e9ffc3f

desktop_chrome_nm_dir: "{{ local_home }}/.var/app/com.google.Chrome/config/google-chrome/NativeMessagingHosts"

desktop_url_handlers:
  x-scheme-handler/bitwarden: bitwarden-apx.desktop
  x-scheme-handler/claude: claude-desktop-launcher.desktop

# dconf values are GVariant text, so strings carry their own quotes
desktop_dconf:
  /org/gnome/shell/enabled-extensions: "[{% for e in gnome_enabled_extensions %}'{{ e }}'{{ ', ' if not loop.last }}{% endfor %}]"
  /org/gnome/desktop/interface/icon-theme: "'Hatter-Blue'"
  /org/gnome/desktop/interface/accent-color: "'blue'"
  # No spinner cursor while apps load (see appearance.yml)
  /org/gnome/desktop/interface/cursor-theme: "'Adwaita-NoBusy'"
  # Screenshots (saved to ~/Pictures/Screenshots and the clipboard). Shift+Alt+3: focused
  # window right away. Shift+Alt+4: the screenshot UI, which opens in the mode used last (Selection unless
  # it was switched there)
  # Sleep after 15 idle minutes on AC too (the default is never). Docked with the lid closed,
  #  waking from sleep re-lights the dock's MST monitors, which screen blanking alone didn't
  /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type: "'suspend'"
  /org/gnome/shell/keybindings/screenshot-window: "['<Alt>Print', '<Shift><Alt>3']"
  /org/gnome/shell/keybindings/show-screenshot-ui: "['Print', '<Shift><Alt>4']"
  # Without xwayland-native-scaling: with it, every X11 app showed a double-size pointer
  /org/gnome/mutter/experimental-features: "['scale-monitor-framebuffer']"
  /org/gnome/Ptyxis/use-system-font: "false"
  /org/gnome/Ptyxis/font-name: "'JetBrainsMono Nerd Font Mono 14'"
  /org/gnome/Ptyxis/audible-bell: "false"
  /org/gnome/Ptyxis/restore-session: "false"
  /org/gnome/Ptyxis/scrollbar-policy: "'never'"
  # Vanilla OS's "vso" profile opens in apx-vso-native; make it start tmux there
  /org/gnome/Ptyxis/Profiles/vso/custom-command: "'/usr/bin/tmux'"
  /org/gnome/Ptyxis/Profiles/vso/use-custom-command: "true"
  /org/gnome/Ptyxis/Profiles/vso/limit-scrollback: "false"
  # The Twingate notifier opens sign-in pages; the panel opening them too gave duplicate tabs
  /org/gnome/shell/extensions/twingate-panel/auth-auto-open: "false"
  /org/gnome/shell/extensions/twingate-panel/privileged-helper: "'/usr/local/libexec/twingate-switch'"

desktop_wp_state: "{{ local_home }}/.local/state/wireplumber"
# Bluetooth headsets' codec profile and latency offset (set in vars/vars.yml)
bt_audio_devices: []
