---
desktop_extensions_dir: "{{ local_home }}/.local/share/gnome-shell/extensions"
desktop_keybinding_path: /org/gnome/settings-daemon/plugins/media-keys/custom-keybindings

# Busy cursor names (incl. the legacy X11 hash names) that Adwaita-NoBusy maps to the arrow
desktop_busy_cursors:
  - wait
  - watch
  - progress
  - left_ptr_watch
  - half-busy
  - 08e8e1c95fe2fc01f976f1e063a24ccd
  - 3ecb610c1bf2410f44200f48c40d3599
  - 00000000000000020006000e7e9ffc3f

desktop_chrome_nm_dir: "{{ local_home }}/.var/app/com.google.Chrome/config/google-chrome/NativeMessagingHosts"

# Login autostart per password_manager:
#  1password: the app in the tray, no window (--silent); it's the SSH agent
#  bitwarden: Bitwarden quick access hidden, which keeps rbw's SSH agent up, and Bitwarden
#   desktop hidden to tray, for the browser extension's biometric unlock
desktop_password_manager_autostart:
  1password: [1password.desktop]
  bitwarden: [rbw-quick-access.desktop, bitwarden-apx.desktop]

# Added with password_manager: bitwarden, removed otherwise
desktop_bitwarden_url_handlers:
  x-scheme-handler/bitwarden: bitwarden-apx.desktop

desktop_url_handlers:
  x-scheme-handler/keybase: keybase-apx.desktop
  x-scheme-handler/web+keybase: keybase-apx.desktop
  x-scheme-handler/claude: claude-desktop-launcher.desktop
  x-scheme-handler/onepassword: 1password.desktop
  x-scheme-handler/onepassword8: 1password.desktop
  x-scheme-handler/mailto: co.hyprlab.Hylki.desktop

# dconf values are GVariant text, so strings carry their own quotes
desktop_dconf:
  # Keep GNOME's Show Applications grid button visible in the overview dash.
  /org/gnome/shell/extensions/just-perfection/show-apps-button: "true"
  /org/gnome/shell/enabled-extensions: "[{% for e in gnome_enabled_extensions %}'{{ e }}'{{ ', ' if not loop.last }}{% endfor %}]"
  # Location services, so GNOME's automatic time zone (on by default) can follow the laptop;
  # timezone-on-wake re-checks after every resume
  /org/gnome/system/location/enabled: "true"
  /org/gnome/desktop/datetime/automatic-timezone: "true"
  /org/gnome/desktop/interface/icon-theme: "'Hatter-Blue'"
  /org/gnome/desktop/interface/accent-color: "'blue'"
  # No spinner cursor while apps load (see appearance.yml)
  /org/gnome/desktop/interface/cursor-theme: "'Adwaita-NoBusy'"
  # Screenshots (saved to ~/Pictures/Screenshots and the clipboard). Shift+Alt+3: focused
  # window right away. Shift+Alt+4: the screenshot UI, which opens in the mode used last (Selection unless
  # it was switched there)
  # Sleep after 15 idle minutes on AC too (the default is never). Docked with the lid closed,
  #  waking from sleep re-lights the dock's MST monitors, which screen blanking alone didn't
  /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type: "'suspend'"
  /org/gnome/shell/keybindings/screenshot-window: "['<Alt>Print', '<Shift><Alt>3']"
  /org/gnome/shell/keybindings/show-screenshot-ui: "['Print', '<Shift><Alt>4']"
  # Without xwayland-native-scaling: with it, every X11 app showed a double-size pointer
  /org/gnome/mutter/experimental-features: "['scale-monitor-framebuffer']"
  # Each app's home workspace. Not Zoom: every window it opens (reactions, chat pop-ups,
  # meeting notices) was moved to its workspace and focused there, switching the desktop
  # to Zoom's main window mid-meeting. Not the electron-apps (Gmail, Calendar, Keep, Tasks,
  # Messages, Messenger) either: with workspaces on the primary display only, workspace 1
  # pinned them to the main monitor; they now reopen where they were left (window-place).
  /org/gnome/shell/extensions/auto-move-windows/application-list: >-
    ['com.google.Chrome.desktop:2', 'org.gnome.Ptyxis.desktop:3',
    'zed-launcher.desktop:3', 'claude-desktop-launcher.desktop:3']
  /org/gnome/Ptyxis/use-system-font: "false"
  /org/gnome/Ptyxis/font-name: "'JetBrainsMono Nerd Font Mono 14'"
  /org/gnome/Ptyxis/audible-bell: "false"
  /org/gnome/Ptyxis/restore-session: "false"
  /org/gnome/Ptyxis/scrollbar-policy: "'never'"
  # Vanilla OS's "vso" profile opens in apx-vso-native; make it start tmux there
  /org/gnome/Ptyxis/Profiles/vso/custom-command: "'/usr/bin/tmux'"
  /org/gnome/Ptyxis/Profiles/vso/use-custom-command: "true"
  /org/gnome/Ptyxis/Profiles/vso/limit-scrollback: "false"
  # The Twingate notifier opens sign-in pages; the panel opening them too gave duplicate tabs
  /org/gnome/shell/extensions/twingate-panel/auth-auto-open: "false"
  /org/gnome/shell/extensions/twingate-panel/privileged-helper: "'/usr/local/libexec/twingate-switch'"

desktop_wp_state: "{{ local_home }}/.local/state/wireplumber"
# Container image retention (retain-container-images): registry repositories whose numbered
# releases (tag_prefix + number) are pruned to the five newest. Set in vars/vars.yml
image_retention_repositories: []
image_retention_tag_prefix: v

# Bluetooth headsets' codec profile and latency offset (set in vars/vars.yml)
bt_audio_devices: []

# Custom GNOME Calendar (github.com/mtharpe/gnome-calendar-zoom, a private repository): built in
# this checkout; downloaded into it with github_token (vars.yml) when it is missing
gnome_calendar_zoom_tarball: https://api.github.com/repos/mtharpe/gnome-calendar-zoom/tarball/main
gnome_calendar_zoom_dir: "{{ local_home }}/src/github/mtharpe/gnome-calendar-zoom"

# Chrome profile router (github.com/mtharpe/chrome-profile-router, private)
chrome_profile_router_tarball: https://api.github.com/repos/mtharpe/chrome-profile-router/tarball/main
chrome_profile_router_dir: "{{ local_home }}/src/github/mtharpe/chrome-profile-router"

# Custom Hylki (github.com/mtharpe/hylki, private): a git checkout, cloned by hand with gh
hylki_custom_dir: "{{ local_home }}/src/github/mtharpe/hylki"

# Check mode evaluates current role code without installing/writing helper files.
desktop_settings_helper: "{{ (role_path ~ '/files/bin/configure-workstation-settings')
                              if ansible_check_mode
                              else (local_home ~ '/.local/bin/configure-workstation-settings') }}"
