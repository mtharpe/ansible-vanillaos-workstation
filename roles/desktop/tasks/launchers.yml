---
# Host has no xdg-mime/xdg-open (Chrome is a Flatpak); open-url wraps `gio open`.
# claude-desktop-launcher / zed-launcher pick the work or personal apx subsystem.
- name: Install helper scripts
  ansible.builtin.copy:
    src: bin/{{ item }}
    dest: "{{ local_home }}/.local/bin/{{ item }}"
    mode: "0755"
  loop:
    - open-url
    - claude-desktop-launcher
    - zed-launcher
    - power-profile-auto
    - update-hatter-icons
    - update-craft-apps
    - screenshot-edit
    - screenshot-capture-edit
    - screenshots-tidy
    - apx-autoconfig
    - displays-reset
    - 1password-desktop
    - zoom-bt-mic
    - bt-av-resync
    - xcursor-refresh
    - timezone-on-wake

# Git's ssh-keygen wrapper, pointed at the chosen password manager's agent
- name: Install the git signing wrapper
  ansible.builtin.template:
    src: ssh-keygen-agent.j2
    dest: "{{ local_home }}/.local/bin/ssh-keygen-agent"
    mode: "0755"

# Bitwarden desktop and quick access (the rbw-quick-access fork), both in apx-bitwarden:
# only with password_manager: bitwarden, removed otherwise
- name: Install the Bitwarden launchers
  ansible.builtin.copy:
    src: bin/{{ item }}
    dest: "{{ local_home }}/.local/bin/{{ item }}"
    mode: "0755"
  loop: [bitwarden-desktop, rbw-quick-access]
  when: password_manager | default('1password') == 'bitwarden'

- name: Remove the Bitwarden launchers
  ansible.builtin.file:
    path: "{{ local_home }}/{{ item }}"
    state: absent
  loop:
    - .local/bin/bitwarden-desktop
    - .local/bin/rbw-quick-access
    - .local/share/applications/bitwarden-apx.desktop
    - .local/share/icons/hicolor/256x256/apps/bitwarden.png
    - .apx-homes/install-bitwarden.sh
  when: password_manager | default('1password') != 'bitwarden'

- name: Install menu entries
  ansible.builtin.copy:
    src: applications/{{ item }}
    dest: "{{ local_home }}/.local/share/applications/{{ item }}"
    mode: "0644"
  loop: "{{ ['1password.desktop', 'claude-desktop-launcher.desktop', 'zed-launcher.desktop']
            + (['bitwarden-apx.desktop'] if password_manager | default('1password') == 'bitwarden' else []) }}"

# Left by the earlier apx-1password setup
- name: Remove the old 1Password entries
  ansible.builtin.file:
    path: "{{ local_home }}/{{ item }}"
    state: absent
  loop:
    - .local/share/applications/1password-apx.desktop
    - .config/autostart/1password-apx.desktop

# Edited key by key: apps add their own entries to this file
- name: Register URL scheme handlers
  community.general.ini_file:
    path: "{{ local_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item.key }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop: "{{ (desktop_url_handlers | combine(desktop_bitwarden_url_handlers if password_manager | default('1password') == 'bitwarden' else {})) | dict2items }}"

- name: Remove the Bitwarden URL handler
  community.general.ini_file:
    path: "{{ local_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    state: absent
  loop: "{{ desktop_bitwarden_url_handlers.keys() | list }}"
  when: password_manager | default('1password') != 'bitwarden'

- name: Install login autostart entries
  ansible.builtin.copy:
    src: autostart/{{ item }}
    dest: "{{ local_home }}/.config/autostart/{{ item }}"
    mode: "0644"
  # BudsLink starts windowless; the Bluetooth Battery Meter extension keeps it running
  loop: "{{ ['com.nextcloud.desktopclient.nextcloud.desktop', 'io.github.maniacx.BudsLink.desktop'] + desktop_password_manager_autostart[password_manager | default('1password')] }}"

# The other password manager's entries, so switching password_manager leaves one running
- name: Remove the other password manager's autostart entries
  ansible.builtin.file:
    path: "{{ local_home }}/.config/autostart/{{ item }}"
    state: absent
  loop: "{{ desktop_password_manager_autostart.values() | flatten | difference(desktop_password_manager_autostart[password_manager | default('1password')]) }}"

# One Zed config shared by every apx profile: each container's ~/.config/zed links here
# (apx_container role). Seeded only, since Zed rewrites settings.json from its UI.
- name: Create the shared Zed config dir
  ansible.builtin.file:
    path: "{{ local_home }}/.apx-homes/zed-config"
    state: directory
    mode: "0755"

- name: Seed the shared Zed config
  ansible.builtin.copy:
    src: zed-config/{{ item }}
    dest: "{{ local_home }}/.apx-homes/zed-config/{{ item }}"
    mode: "0644"
    force: false
  loop:
    - settings.json
    - keymap.json
