---
# The host has no cron; scheduled jobs are systemd user timers.
- name: Install user units
  ansible.builtin.copy:
    src: systemd/{{ item }}
    dest: "{{ local_home }}/.config/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - power-profile-auto.service
    - update-hatter-icons.service
    - update-hatter-icons.timer
    - update-craft-apps.service
    - update-craft-apps.timer
    - screenshots-tidy.path
    - screenshots-tidy.service
    - zoom-bt-mic.service
    - bt-av-resync.service
    - xcursor-refresh.service
    - timezone-on-wake.service
    - apx-autoconfig.service

# The Twingate notifier (unit installed by the system role) opens the sign-in page via
# $BROWSER; point it at gio since the host has no xdg-open
- name: Point the Twingate notifier at open-url
  ansible.builtin.copy:
    src: systemd/twingate-notifier-browser.conf
    dest: "{{ local_home }}/.config/systemd/user/twingate-desktop-notifier.service.d/browser.conf"
    mode: "0644"

# timezone-on-wake locates the laptop with Google's Geolocation API when it has a key
# (google_geolocation_api_key in vars.yml), else BeaconDB only
- name: Create the timezone-on-wake config dir
  ansible.builtin.file:
    path: "{{ local_home }}/.config/timezone-on-wake"
    state: directory
    mode: "0700"
  when: google_geolocation_api_key | default('') | length > 0

- name: Install the Geolocation API key
  ansible.builtin.copy:
    content: "{{ google_geolocation_api_key }}\n"
    dest: "{{ local_home }}/.config/timezone-on-wake/google-api-key"
    mode: "0600"
  no_log: true
  when: google_geolocation_api_key | default('') | length > 0

# podman.socket: the Docker API for the docker CLI in the dev subsystems (devops_tools).
# apx-autoconfig: runs the containers play on each newly created apx subsystem.
# twingate-desktop-notifier: the package leaves it disabled, and without it nothing shows
# the "Additional authentication required" prompts, so MFA-gated resources stay Pending
# and their traffic is held.
- name: Enable user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - power-profile-auto.service
    - update-hatter-icons.timer
    - update-craft-apps.timer
    - screenshots-tidy.path
    - zoom-bt-mic.service
    - bt-av-resync.service
    - xcursor-refresh.service
    - timezone-on-wake.service
    - apx-autoconfig.service
    - podman.socket
    - twingate-desktop-notifier.service

# SSH keys live only in the vault: the password manager's agent (1Password or rbw) is the
# session's SSH_AUTH_SOCK (apps and the apx containers inherit it), and the GNOME (gcr) and
# OpenSSH agents are masked
- name: Point the session at the password manager's SSH agent
  ansible.builtin.template:
    src: 90-ssh-agent.conf.j2
    dest: "{{ local_home }}/.config/environment.d/90-ssh-agent.conf"
    mode: "0644"

# Left by earlier versions, which named the file after the agent
- name: Remove the old session agent settings
  ansible.builtin.file:
    path: "{{ local_home }}/.config/environment.d/{{ item }}"
    state: absent
  loop: [90-rbw-ssh-agent.conf, 90-1password-ssh-agent.conf]

- name: Mask the other SSH agents
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    masked: true
    state: stopped
  loop:
    - gcr-ssh-agent.socket
    - gcr-ssh-agent.service
    - ssh-agent.socket
    - ssh-agent.service
