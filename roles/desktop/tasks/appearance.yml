---
- name: Create Nerd Font directories
  ansible.builtin.file:
    path: "{{ local_home }}/.local/share/fonts/NerdFonts/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ nerd_fonts }}"

- name: Install Nerd Fonts
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/{{ nerd_fonts_version }}/{{ item }}.tar.xz
    dest: "{{ local_home }}/.local/share/fonts/NerdFonts/{{ item }}"
    remote_src: true
    creates: "{{ local_home }}/.local/share/fonts/NerdFonts/{{ item }}/LICENSE.txt"
  loop: "{{ nerd_fonts }}"
  notify: Rebuild font cache

# Hatter icons (github.com/Mibea/Hatter); kept current by update-hatter-icons.timer
- name: Install the Hatter icon theme
  ansible.builtin.command: "{{ local_home }}/.local/bin/update-hatter-icons"
  args:
    creates: "{{ local_home }}/.local/share/icons/Hatter-Blue/index.theme"

# GNOME has no setting to turn off the busy (spinner) cursor. Adwaita-NoBusy is Adwaita
# with the busy cursors pointing at the normal arrow; selected via desktop_dconf.
- name: Create the Adwaita-NoBusy cursor theme
  ansible.builtin.file:
    path: "{{ local_home }}/.local/share/icons/Adwaita-NoBusy/cursors"
    state: directory
    mode: "0755"

- name: Install the Adwaita-NoBusy theme index
  ansible.builtin.copy:
    content: |
      [Icon Theme]
      Name=Adwaita-NoBusy
      Comment=Adwaita cursors without the busy spinner
      Inherits=Adwaita
    dest: "{{ local_home }}/.local/share/icons/Adwaita-NoBusy/index.theme"
    mode: "0644"

- name: Point the busy cursors at the arrow
  ansible.builtin.file:
    src: /usr/share/icons/Adwaita/cursors/default
    dest: "{{ local_home }}/.local/share/icons/Adwaita-NoBusy/cursors/{{ item }}"
    state: link
    force: true
  loop: "{{ desktop_busy_cursors }}"
