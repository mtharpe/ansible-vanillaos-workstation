---
- name: Install Flatpak apps (user)
  community.general.flatpak:
    name: "{{ flatpak_apps }}"
    method: user
    remote: flathub

# Hylki (Rust/GNOME mail client with a unified inbox) is not on Flathub; it installs from its
# own signed repository via its flatpakref, which also adds that remote for updates.
- name: Install Hylki
  ansible.builtin.command: flatpak install --user -y --noninteractive --from https://hylki.hyprlab.co/flatpak/co.hyprlab.Hylki.flatpakref
  args:
    creates: "{{ local_home }}/.local/share/flatpak/app/co.hyprlab.Hylki"

# The custom Hylki (github.com/mtharpe/hylki, private, branch chrome-profiles): Hylki plus a
# per-account Chrome profile for links. Built from the checkout (it needs git history, so no
# tarball) into a local Flatpak repo and made current; the release from Hylki's repo stays as
# the fallback (flatpak make-current --user co.hyprlab.Hylki stable). update-hylki-custom.timer
# rebuilds it on each new Hylki release.
- name: Check for the custom Hylki
  ansible.builtin.command: flatpak info --user co.hyprlab.Hylki//master
  register: desktop_hylki_custom
  changed_when: false
  failed_when: false
  check_mode: false

- name: Look for the custom Hylki checkout
  ansible.builtin.stat:
    path: "{{ hylki_custom_dir }}/tools/custom/update.sh"
  register: desktop_hylki_src

- name: Build and install the custom Hylki (takes a while)
  ansible.builtin.command: "{{ hylki_custom_dir }}/tools/custom/update.sh --force"
  when: desktop_hylki_custom.rc != 0 and desktop_hylki_src.stat.exists
  async: 7200
  poll: 30

# Hatter has no Hylki icon; a user copy of its launcher (it shadows the Flatpak's export)
# points at Hatter's standard mail-app icon and calls it "Mail" (the [Desktop Entry] name only;
# the New Message action keeps its own). Regenerated from the export, so Exec stays current.
- name: Call Hylki "Mail" and give it the icon theme's mail-app icon
  ansible.builtin.shell: |
    set -eu
    src={{ local_home }}/.local/share/flatpak/exports/share/applications/co.hyprlab.Hylki.desktop
    dst={{ local_home }}/.local/share/applications/co.hyprlab.Hylki.desktop
    sed -e 's/^Icon=.*/Icon=internet-mail/' -e '1,/^\[Desktop Action/ s/^Name=.*/Name=Mail/' "$src" > "$dst.tmp"
    if cmp -s "$dst.tmp" "$dst"; then rm "$dst.tmp"; echo same; else mv "$dst.tmp" "$dst"; echo changed; fi
  register: desktop_hylki_icon
  changed_when: "'changed' in desktop_hylki_icon.stdout"

# Hylki mail rules (filters.toml, from hylki-rules.toml.j2) on each account in
# hylki_mail_rule_accounts (vars.yml): meeting replies and Zoom's deleted-meeting notices filed
# under their own labels. Rules are only added when missing, so changes made in Hylki's Settings stay.
- name: Write the wanted Hylki mail rules
  ansible.builtin.template:
    src: hylki-rules.toml.j2
    dest: "{{ local_home }}/.local/share/hylki-rules.toml"
    mode: "0600"
  when: hylki_mail_rule_accounts | default([]) | length > 0

- name: Add missing Hylki mail rules
  ansible.builtin.command: "{{ local_home }}/.local/bin/hylki-ensure-rules {{ local_home }}/.local/share/hylki-rules.toml"
  register: desktop_hylki_rules
  changed_when: "'changed' in desktop_hylki_rules.stdout"
  when: hylki_mail_rule_accounts | default([]) | length > 0

# GNOME Calendar keeps its own icon (Hatter's calendar page); drop the earlier Google one
- name: Remove the GNOME Calendar launcher copy
  ansible.builtin.file:
    path: "{{ local_home }}/.local/share/applications/org.gnome.Calendar.desktop"
    state: absent

# GNOME Calendar with guests, Zoom meetings, people lookup and reminders you snooze from the
# notification (github.com/mtharpe/gnome-calendar-zoom, private). Built from source into a local Flatpak
# repository and made the current Calendar; Flathub's stays installed as the fallback
# (flatpak make-current --user org.gnome.Calendar stable). Built once; rebuild by hand.
- name: Check for the custom GNOME Calendar
  ansible.builtin.command: flatpak info --user org.gnome.Calendar//master
  register: desktop_gcal_custom
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build and install the custom GNOME Calendar
  when: desktop_gcal_custom.rc != 0
  block:
    - name: Install the Flatpak builder and the GNOME 51 SDK
      ansible.builtin.command: >-
        flatpak install --user -y --noninteractive flathub
        org.flatpak.Builder org.gnome.Sdk//51 org.gnome.Platform//51
      register: desktop_gcal_sdk
      changed_when: "'Nothing to do' not in desktop_gcal_sdk.stdout"

    # The repository is private: build from the checkout when there is one (it comes over with
    # ~/src), else download it with github_token (vars.yml). Without either, nothing is built
    # and the standard reminders stay on (below).
    - name: Look for the custom GNOME Calendar source
      ansible.builtin.stat:
        path: "{{ gnome_calendar_zoom_dir }}/build.sh"
      register: desktop_gcal_src

    - name: Create the custom GNOME Calendar source dir
      ansible.builtin.file:
        path: "{{ gnome_calendar_zoom_dir }}"
        state: directory
        mode: "0755"
      when: not desktop_gcal_src.stat.exists and github_token is defined

    - name: Download the custom GNOME Calendar source (private repository)
      ansible.builtin.get_url:
        url: "{{ gnome_calendar_zoom_tarball }}"
        dest: "{{ local_home }}/.cache/gnome-calendar-zoom.tar.gz"
        headers:
          Authorization: "Bearer {{ github_token }}"
        mode: "0600"
      when: not desktop_gcal_src.stat.exists and github_token is defined
      no_log: true

    - name: Unpack the custom GNOME Calendar source
      ansible.builtin.unarchive:
        src: "{{ local_home }}/.cache/gnome-calendar-zoom.tar.gz"
        dest: "{{ gnome_calendar_zoom_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]
      when: not desktop_gcal_src.stat.exists and github_token is defined

    - name: Look for the custom GNOME Calendar source again
      ansible.builtin.stat:
        path: "{{ gnome_calendar_zoom_dir }}/build.sh"
      register: desktop_gcal_src

    - name: Say why the custom GNOME Calendar is not built
      ansible.builtin.debug:
        msg: >-
          No source for the custom GNOME Calendar: restore ~/src/github/mtharpe/gnome-calendar-zoom
          or set github_token in vars.yml. Keeping the standard reminders.
      when: not desktop_gcal_src.stat.exists

    - name: Build the custom GNOME Calendar (takes a while)
      ansible.builtin.command: ./build.sh
      args:
        chdir: "{{ gnome_calendar_zoom_dir }}"
      async: 7200
      poll: 30
      when: desktop_gcal_src.stat.exists

    - name: Add the custom GNOME Calendar's local repository
      ansible.builtin.command: >-
        flatpak remote-add --user --if-not-exists --no-gpg-verify
        gnome-calendar-zoom file://{{ gnome_calendar_zoom_dir }}/repo
      when: desktop_gcal_src.stat.exists

    - name: Install the custom GNOME Calendar
      ansible.builtin.command: flatpak install --user -y --noninteractive gnome-calendar-zoom org.gnome.Calendar//master
      when: desktop_gcal_src.stat.exists

    - name: Make the custom GNOME Calendar the one that runs
      ansible.builtin.command: flatpak make-current --user org.gnome.Calendar master
      when: desktop_gcal_src.stat.exists

# Links from the custom Calendar and Mail open in the Chrome profile of their account, through
# chrome-profile-router (github.com/mtharpe/chrome-profile-router, private): from the checkout,
# or downloaded with github_token (vars.yml) when it is missing.
- name: Look for the Chrome profile router
  ansible.builtin.stat:
    path: "{{ chrome_profile_router_dir }}/install.sh"
  register: desktop_router_src

- name: Download the Chrome profile router (private repository)
  when: not desktop_router_src.stat.exists and github_token is defined
  block:
    - name: Create the Chrome profile router dir
      ansible.builtin.file:
        path: "{{ chrome_profile_router_dir }}"
        state: directory
        mode: "0755"

    - name: Download the Chrome profile router source
      ansible.builtin.get_url:
        url: "{{ chrome_profile_router_tarball }}"
        dest: "{{ local_home }}/.cache/chrome-profile-router.tar.gz"
        headers:
          Authorization: "Bearer {{ github_token }}"
        mode: "0600"
      no_log: true

    - name: Unpack the Chrome profile router source
      ansible.builtin.unarchive:
        src: "{{ local_home }}/.cache/chrome-profile-router.tar.gz"
        dest: "{{ chrome_profile_router_dir }}"
        remote_src: true
        extra_opts: [--strip-components=1]

- name: Install the Chrome profile router
  ansible.builtin.command: "{{ chrome_profile_router_dir }}/install.sh"
  args:
    creates: "{{ local_home }}/.local/share/applications/io.github.mtharpe.LinkProfiles.desktop"
  when: desktop_router_src.stat.exists or github_token is defined

- name: Check the custom GNOME Calendar again
  ansible.builtin.command: flatpak info --user org.gnome.Calendar//master
  register: desktop_gcal_custom
  changed_when: false
  failed_when: false
  check_mode: false

# Reminders: the custom Calendar runs in the background and replaces evolution-alarm-notify
# (whose reminders open a separate window). Only with the custom build installed; without it,
# the old reminders stay on, so there are always reminders.
- name: Turn reminders over to the custom GNOME Calendar
  ansible.builtin.copy:
    src: autostart/{{ item }}
    dest: "{{ local_home }}/.config/autostart/{{ item }}"
    mode: "0644"
  loop: [org.gnome.Calendar-reminders.desktop, org.gnome.Evolution-alarm-notify.desktop]
  when: desktop_gcal_custom.rc == 0

- name: Keep the standard reminders without the custom GNOME Calendar
  ansible.builtin.file:
    path: "{{ local_home }}/.config/autostart/{{ item }}"
    state: absent
  loop: [org.gnome.Calendar-reminders.desktop, org.gnome.Evolution-alarm-notify.desktop]
  when: desktop_gcal_custom.rc != 0

# ArtCraft's Craft apps (open-source Adobe-suite rebuilds and more) ship only as Flatpak
# bundles on GitHub; update-craft-apps installs them and its weekly timer keeps them current
- name: Install the Craft apps
  ansible.builtin.command: "{{ local_home }}/.local/bin/update-craft-apps"
  register: desktop_craft_apps
  changed_when: "'Updating ' in desktop_craft_apps.stdout"

# Chrome: may talk to org.freedesktop.Flatpak.
# Wayland everywhere it works: Slack and MeshLab are moved onto it here, Zoom below.
#  Left on X11: Nextcloud (with Wayland its tray menu opens mid-screen), Bambu Studio
#  (Flathub ships it X11-only; its 3D view misbehaves on Wayland), OnlyOffice (no
#  Wayland support in its bundled Qt), Chrome (flag file below).
# global: cursor theme path for every app (freedesktop runtimes ship no cursors), so X11
#  apps find Adwaita-NoBusy instead of falling back to the huge core cursor.
- name: Install Flatpak overrides
  ansible.builtin.copy:
    src: flatpak-overrides/
    dest: "{{ local_home }}/.local/share/flatpak/overrides/"
    mode: "0644"

# Chrome on X11. On Wayland it can't see workspaces, so a link from another app goes to the
# profile's last-focused window of any kind. When that is an app, pop-up or
# picture-in-picture window, the link opens in a new window instead of a new tab. On X11 it
# picks the last normal window on the current workspace. A flag, not removing the Wayland
# socket: Chrome then still picks Wayland (from the session type) and exits at startup.
- name: Create Chrome's config dir
  ansible.builtin.file:
    path: "{{ local_home }}/.var/app/com.google.Chrome/config"
    state: directory
    mode: "0755"

- name: Run Chrome on X11
  ansible.builtin.copy:
    src: chrome-flags.conf
    dest: "{{ local_home }}/.var/app/com.google.Chrome/config/chrome-flags.conf"
    mode: "0644"

# Bitwarden extension <-> desktop app (biometric unlock) in every Chrome profile, with
# password_manager: bitwarden. Chrome reads native messaging hosts per user data dir, so
# one manifest covers all profiles.
- name: Create Chrome's native messaging host dir
  ansible.builtin.file:
    path: "{{ desktop_chrome_nm_dir }}"
    state: directory
    mode: "0755"

- name: Install the Bitwarden native messaging host
  ansible.builtin.copy:
    src: bitwarden/bitwarden-native-messaging
    dest: "{{ desktop_chrome_nm_dir }}/bitwarden-native-messaging"
    mode: "0755"
  when: password_manager | default('1password') == 'bitwarden'

- name: Register the Bitwarden native messaging host
  ansible.builtin.template:
    src: com.8bit.bitwarden.json.j2
    dest: "{{ desktop_chrome_nm_dir }}/com.8bit.bitwarden.json"
    mode: "0644"
  when: password_manager | default('1password') == 'bitwarden'

- name: Remove the Bitwarden native messaging host
  ansible.builtin.file:
    path: "{{ desktop_chrome_nm_dir }}/{{ item }}"
    state: absent
  loop: [bitwarden-native-messaging, com.8bit.bitwarden.json]
  when: password_manager | default('1password') != 'bitwarden'

# Same for the 1Password extension: it shows the app's sign-in and lock state, and unlocks
# with it. The container side (chrome-flatpak, the allowlist) is in apx_container.
- name: Install the 1Password native messaging host
  ansible.builtin.copy:
    src: onepassword/1password-native-messaging
    dest: "{{ desktop_chrome_nm_dir }}/1password-native-messaging"
    mode: "0755"

- name: Register the 1Password native messaging host
  ansible.builtin.template:
    src: com.1password.1password.json.j2
    dest: "{{ desktop_chrome_nm_dir }}/com.1password.1password.json"
    mode: "0644"

# Gradia (screenshot editor): its recent-screenshots picker looks in ~/Pictures/Screenshots.
# Sandboxed apps keep GSettings in a keyfile under ~/.var/app.
- name: Point Gradia at the screenshots folder
  community.general.ini_file:
    path: "{{ local_home }}/.var/app/be.alexandervanhee.gradia/config/glib-2.0/settings/keyfile"
    section: be/alexandervanhee/gradia
    option: screenshot-folder
    value: "'{{ local_home }}/Pictures/Screenshots'"
    no_extra_spaces: true
    mode: "0644"

# Gradia 1.14.0 fetches its upload-provider list from upload-providers/1.14.0.json, which
# 404s on gradia.alexandervanhee.be (2026-10-19), so Preferences offers no providers at all.
# Picking one only stores these two values, so set Imgur from the 1.13.0 list directly.
- name: Set Gradia's upload provider (Imgur)
  community.general.ini_file:
    path: "{{ local_home }}/.var/app/be.alexandervanhee.gradia/config/glib-2.0/settings/keyfile"
    section: be/alexandervanhee/gradia
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - option: provider-name
      value: "'Imgur'"
    - option: custom-export-command
      value: !unsafe "\"curl -s -H \\\"Authorization: Client-ID fc2a3faf090d08b\\\" -F \\\"image=@$1\\\" https://api.imgur.com/3/image | tee >(sed -n 's/.*\\\"deletehash\\\":\\\"\\\\([^\\\"]*\\\\)\\\".*/\\\\1/p' | while read h; do echo \\\"[$(date +%F_%T)] $h\\\"; done >> \\\"$XDG_CONFIG_HOME/imgur-delete-hashes.txt\\\") | sed -n 's/.*\\\"link\\\":\\\"\\\\([^\\\"]*\\\\)\\\".*/\\\\1/p' | sed 's/\\\\\\\\//g'\""
  loop_control:
    label: "{{ item.option }}"

# Zoom: don't shrink the meeting into the floating mini window when it loses focus, and
# run it as a native Wayland client so status changes can't raise it and steal focus
# (under XWayland they can). Zoom rewrites zoomus.conf while running; apply with it quit.
- name: Set Zoom's window settings
  community.general.ini_file:
    path: "{{ local_home }}/.var/app/us.zoom.Zoom/config/zoomus.conf"
    section: General
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    no_extra_spaces: true
    mode: "0644"
  loop:
    - { option: enableMiniWindow, value: "false" }
    - { option: xwayland, value: "false" }
  loop_control:
    label: "{{ item.option }}"

# ZoomLauncher reads xwayland from ~/.config/zoomus.conf, which the sandbox doesn't have;
# the override persists .config in the app dir, and this points it at the real file
- name: Create Zoom's persisted .config dir
  ansible.builtin.file:
    path: "{{ local_home }}/.var/app/us.zoom.Zoom/.config"
    state: directory
    mode: "0755"

- name: Point ZoomLauncher at zoomus.conf
  ansible.builtin.file:
    src: "{{ local_home }}/.var/app/us.zoom.Zoom/config/zoomus.conf"
    dest: "{{ local_home }}/.var/app/us.zoom.Zoom/.config/zoomus.conf"
    state: link
    force: true
