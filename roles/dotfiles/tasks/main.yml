---
# Shared by the host and the apx containers: their shells source these by absolute path,
# because ~ inside a container is that container's own home.
- name: Create config directories
  ansible.builtin.file:
    path: "{{ local_home }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: .ssh, mode: "0700" }
    - { path: .config/lazygit, mode: "0755" }

- name: Install dotfiles
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ local_home }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    backup: true
  loop:
    - { src: bashrc, dest: .bashrc }
    - { src: bash_aliases, dest: .bash_aliases }
    - { src: inputrc, dest: .inputrc }
    - { src: gitconfig, dest: .gitconfig }
    - { src: lazygit.yml, dest: .config/lazygit/config.yml }
    # IdentityAgent = rbw's SSH agent socket (rbw runs in the bitwarden subsystem)
    - { src: ssh_config, dest: .ssh/config, mode: "0600" }
  loop_control:
    label: "{{ item.dest }}"

# Git commit signing (gitconfig) needs the public half of the vault's SSH key. It isn't kept
# in this repo: read it from rbw's agent. On a fresh machine rbw isn't logged in yet, so this
# is skipped; re-run `./run.sh user` after setting up rbw.
- name: Read the signing key from rbw's SSH agent
  ansible.builtin.command: ssh-add -L
  environment:
    SSH_AUTH_SOCK: /run/user/1000/rbw/ssh-agent-socket
  register: dotfiles_agent_keys
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the signing key and allowed_signers
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ local_home }}/.ssh/{{ item.dest }}"
    mode: "0644"
  loop:
    - { dest: bitwarden-personal.pub, content: "{{ dotfiles_signing_key }}" }
    - { dest: allowed_signers, content: 'mtharpe@users.noreply.github.com namespaces="git" {{ dotfiles_signing_key }}' }
  loop_control:
    label: "{{ item.dest }}"
  vars:
    dotfiles_signing_key: "{{ dotfiles_agent_keys.stdout_lines | first | trim }}"
  when: dotfiles_agent_keys.rc == 0

- name: Warn that commit signing isn't set up yet
  ansible.builtin.debug:
    msg: rbw's SSH agent has no key (rbw not logged in or locked); re-run ./run.sh user after unlocking rbw
  when: dotfiles_agent_keys.rc != 0
