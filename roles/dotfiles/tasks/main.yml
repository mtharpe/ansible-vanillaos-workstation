---
# Shared by the host and the apx containers: their shells source these by absolute path,
# because ~ inside a container is that container's own home.
- name: Create config directories
  ansible.builtin.file:
    path: "{{ local_home }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: .ssh, mode: "0700" }
    - { path: .config/lazygit, mode: "0755" }

- name: Install dotfiles
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ local_home }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    backup: true
  loop:
    - { src: bashrc, dest: .bashrc }
    - { src: bash_aliases, dest: .bash_aliases }
    - { src: inputrc, dest: .inputrc }
    - { src: gitconfig, dest: .gitconfig }
    - { src: lazygit.yml, dest: .config/lazygit/config.yml }
  loop_control:
    label: "{{ item.dest }}"

# The SSH agent of the password manager picked in vars.yml (password_manager): IdentityAgent
# for ssh, SSH_AUTH_SOCK for shells (.bashrc sources ssh-agent.bash)
- name: Point SSH at the password manager's agent
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ local_home }}/{{ item.dest }}"
    mode: "{{ item.mode }}"
    backup: true
  loop:
    - { src: ssh_config.j2, dest: .ssh/config, mode: "0600" }
    - { src: ssh-agent.bash.j2, dest: .config/ssh-agent.bash, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"

# Git commit signing (gitconfig) needs the public half of the vault's SSH key. It isn't kept
# in this repo: read it from the password manager's agent. On a fresh machine that isn't
# signed in yet, so this is skipped; re-run `./run.sh user` after setting it up.
- name: Read the signing key from the SSH agent
  ansible.builtin.command: ssh-add -L
  environment:
    SSH_AUTH_SOCK: "{{ ssh_agent_sockets[0] }}"
  register: dotfiles_agent_keys
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the signing key and allowed_signers
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ local_home }}/.ssh/{{ item.dest }}"
    mode: "0644"
  loop:
    - { dest: git-signing.pub, content: "{{ dotfiles_signing_key }}" }
    - { dest: allowed_signers, content: 'mtharpe@users.noreply.github.com namespaces="git" {{ dotfiles_signing_key }}' }
  loop_control:
    label: "{{ item.dest }}"
  vars:
    dotfiles_signing_key: "{{ dotfiles_agent_keys.stdout_lines | first | trim }}"
  when: dotfiles_agent_keys.rc == 0

- name: Warn that commit signing isn't set up yet
  ansible.builtin.debug:
    msg: "The {{ password_manager | default('1password') }} SSH agent has no key (not running, locked, or the agent is off); re-run ./run.sh user once it serves the key"
  when: dotfiles_agent_keys.rc != 0
