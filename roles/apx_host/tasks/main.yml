---
# Create the apx subsystems that containers.yml configures: Ubuntu unless the entry names another
# apt-based stack (debian), each with its own home if it names one.
- name: Create subsystem homes
  ansible.builtin.file:
    path: "{{ item.home }}"
    state: directory
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ apx_subsystems | selectattr('home', 'defined') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check which subsystems exist
  ansible.builtin.command: podman container exists apx-{{ item.name }}
  loop: "{{ apx_subsystems }}"
  loop_control:
    label: "{{ item.name }}"
  register: apx_host_exists
  changed_when: false
  check_mode: false
  failed_when: apx_host_exists.rc not in [0, 1]

- name: Create missing subsystems
  ansible.builtin.command: apx subsystems new -n {{ item.item.name }} -s {{ item.item.stack | default('ubuntu') }}{{ ' -H ' ~ item.item.home if item.item.home is defined else '' }}
  loop: "{{ apx_host_exists.results | selectattr('rc', '==', 1) }}"
  loop_control:
    label: "{{ item.item.name }}"
  changed_when: true

# containers.yml reaches them with `podman exec`, which needs them running
- name: Start subsystems
  ansible.builtin.command: podman start apx-{{ item.name }}
  loop: "{{ apx_subsystems }}"
  loop_control:
    label: "{{ item.name }}"
  register: apx_host_start
  changed_when: false
