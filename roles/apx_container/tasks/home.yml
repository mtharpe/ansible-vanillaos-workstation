---
# A subsystem with its own home shares the host home's shell and git settings by including
# them (managed blocks, so the subsystem can still add its own), and uses the host ~/.ssh
# itself (a symlink). Logins stay per
# home: gh's hosts.yml, ~/.docker, and the cloud CLIs (~/.aws, ~/.config/gcloud, ~/.azure,
# ~/.kube, ~/.terraform.d) are never linked, so work and personal keep separate accounts.

# A path in this home can already lead to the host's file (a linked ~/.ssh, or a linked
# dotfile); writing an include there would make the host file include itself
- name: Resolve the shared files
  ansible.builtin.command: realpath -m {{ apx_home }}/{{ item }}
  loop: [.bashrc, .gitconfig]
  register: apx_home_paths
  changed_when: false
  check_mode: false

- name: Note which ones are the host's own
  ansible.builtin.set_fact:
    apx_home_is_host: "{{ apx_home_paths.results
                          | selectattr('stdout', 'in', apx_home_paths.results | map(attribute='item') | map('regex_replace', '^', local_home ~ '/'))
                          | map(attribute='item') | list }}"

# The host .bashrc brings the prompt, aliases and the host ~/.local/bin (cli_tools) on PATH
- name: Source the host .bashrc
  ansible.builtin.blockinfile:
    path: "{{ apx_home }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} shared settings from the host home"
    block: |
      if [ -f {{ local_home }}/.bashrc ]; then
          . {{ local_home }}/.bashrc
      fi
  when: "'.bashrc' not in apx_home_is_host"

# Identity, signing (through 1Password) and delta; first, so this home's own settings (gh's
# credential helper) still win
- name: Include the host .gitconfig
  ansible.builtin.blockinfile:
    path: "{{ apx_home }}/.gitconfig"
    create: true
    mode: "0644"
    insertbefore: BOF
    marker: "# {mark} host gitconfig"
    block: |
      [include]
      	path = {{ local_home }}/.gitconfig
  when: "'.gitconfig' not in apx_home_is_host"

# One ~/.ssh everywhere: the host's config (1Password or rbw agent, known_hosts) and git's
# signing key + allowed_signers. Keys never live there (they're in the password manager's
# agent), and every subsystem runs as the same user, so ssh's permission checks pass.
- name: Check this home's .ssh
  ansible.builtin.stat:
    path: "{{ apx_home }}/.ssh"
  register: apx_home_ssh

# Earlier setups made a .ssh holding only an Include of the host config; keep it aside
- name: Move this home's own .ssh aside
  ansible.builtin.command: mv {{ apx_home }}/.ssh {{ apx_home }}/.ssh.pre-link
  args:
    creates: "{{ apx_home }}/.ssh.pre-link"
  when: apx_home_ssh.stat.exists and apx_home_ssh.stat.isdir and not apx_home_ssh.stat.islnk

- name: Link the host .ssh
  ansible.builtin.file:
    src: "{{ local_home }}/.ssh"
    dest: "{{ apx_home }}/.ssh"
    state: link
