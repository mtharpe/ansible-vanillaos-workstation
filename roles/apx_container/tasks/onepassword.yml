---
# 1Password desktop + CLI from 1Password's apt repo (updates come with apt upgrade). The app
# is the SSH agent and git signer (agent socket ~/.1password/agent.sock in this subsystem's
# home); op talks to the running app for its sign-in.
- name: Add the 1Password apt key
  ansible.builtin.get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /etc/apt/keyrings/1password.asc
    mode: "0644"
  become: true

- name: Add the 1Password apt repo
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://downloads.1password.com/linux/debian/amd64
      Suites: stable
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/1password.asc
    dest: /etc/apt/sources.list.d/1password.sources
    mode: "0644"
  become: true

# The .deb leaves out some of Electron's libraries, like Bitwarden's
- name: Install 1Password
  ansible.builtin.apt:
    name: [1password, 1password-cli, libasound2t64, libnss3, libgbm1, libgtk-3-0t64, libxss1,
           libsecret-1-0, libnotify4, xdg-utils]
    update_cache: true
  become: true
  when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

- name: Copy the 1Password icon to the host
  ansible.builtin.copy:
    src: /usr/share/icons/hicolor/256x256/apps/1password.png
    dest: "{{ local_home }}/.local/share/icons/hicolor/256x256/apps/1password.png"
    remote_src: true
    mode: "0644"
  when: not ansible_check_mode

# Flatpak Chrome's extension reaches BrowserSupport through 1password-native-messaging
# (desktop role). 1Password only accepts a BrowserSupport whose parent process is a known
# browser executable or one named in custom_allowed_browsers; here the parent would be the
# shell distrobox-enter runs, so BrowserSupport is started by a copy of dash named
# chrome-flatpak, and that name is allowed.
- name: Install the browser stand-in for Flatpak Chrome
  ansible.builtin.copy:
    src: /usr/bin/dash
    dest: /usr/local/libexec/chrome-flatpak
    remote_src: true
    mode: "0755"
  become: true

# The trailing exit keeps dash from exec-ing BrowserSupport, so it stays the parent
- name: Install the BrowserSupport launcher for Flatpak Chrome
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Run from Flatpak Chrome via 1password-native-messaging on the host
      exec /usr/local/libexec/chrome-flatpak -c '/opt/1Password/1Password-BrowserSupport "$@"; exit $?' chrome-flatpak "$@"
    dest: /usr/local/bin/chrome-flatpak
    mode: "0755"
  become: true

# The .deb ships this file without a trailing newline; 1Password reads it at startup
- name: Allow the Flatpak Chrome stand-in
  ansible.builtin.lineinfile:
    path: /etc/1password/custom_allowed_browsers
    line: chrome-flatpak
    create: true
    mode: "0644"
  become: true

- name: Open URLs on the host
  ansible.builtin.import_tasks: xdg_open.yml
