---
# Every subsystem is logged in to GitHub as the same account. gh keeps the token in the host's
# login keyring, one entry that all subsystems share, plus a per-$HOME hosts.yml naming the
# account; a subsystem without one gets it from a subsystem that has it. So `gh auth logout`
# anywhere drops the token everywhere. On a fresh machine none is logged in: log in once in any
# of them (gh auth login --web) and run the containers play again.
- name: Check the gh login
  environment: "{{ apx_gh_env }}"
  ansible.builtin.command: gh auth status --hostname github.com
  register: apx_gh_status
  changed_when: false
  failed_when: false
  check_mode: false

# From any running subsystem, not just this run's: the new-subsystem watcher runs the play for
# one subsystem only. (Delegating with an empty host fails even when skipped, so loop instead.)
- name: Read the gh token from a logged-in subsystem
  environment: "{{ apx_gh_env }}"
  ansible.builtin.command: gh auth token --hostname github.com
  register: apx_gh_tokens
  delegate_to: "{{ item }}"
  loop: "{{ groups['apx'] }}"
  run_once: true
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when: ansible_play_hosts | map('extract', hostvars, ['apx_gh_status', 'rc']) | select('ne', 0) | list | length > 0

- name: Pick the gh token
  ansible.builtin.set_fact:
    apx_gh_token: "{{ apx_gh_tokens.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0)
                      | map(attribute='stdout') | select | first | default('') }}"
  no_log: true

- name: Warn that no subsystem is logged in to gh
  ansible.builtin.debug:
    msg: No subsystem is logged in to GitHub; run `gh auth login --web` in one and rerun the containers play
  when: apx_gh_status.rc != 0 and apx_gh_token == ''

- name: Log in to gh
  environment: "{{ apx_gh_env }}"
  ansible.builtin.command: gh auth login --hostname github.com --git-protocol https --with-token
  args:
    stdin: "{{ apx_gh_token }}"
  no_log: true
  when: apx_gh_status.rc != 0 and apx_gh_token != ''

# git over HTTPS asks gh for the GitHub password

- name: Set up gh as git's GitHub credential helper
  environment: "{{ apx_gh_env }}"
  ansible.builtin.command: gh auth setup-git --hostname github.com
  changed_when: false
  when: apx_gh_status.rc == 0 or apx_gh_token != ''
