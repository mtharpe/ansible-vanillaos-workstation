---
# The host has no xdg-open, so links and sign-ins opened from here go to the host's gio
- name: Open URLs on the host
  ansible.builtin.copy:
    content: |
      #!/bin/sh
      # Open URLs/files on the host. Vanilla OS host has no xdg-open, so use gio.
      # host-spawn runs gio in the caller's directory, and apps started from a host
      # launcher sit in /run/host/..., which doesn't exist on the host (gio then fails
      # with 127), so make file paths absolute host paths and run from /.
      for arg; do
          [ -e "$arg" ] && arg=$(realpath "$arg") && arg=${arg#/run/host}
          set -- "$@" "$arg"; shift
      done
      cd / && exec /usr/bin/distrobox-host-exec gio open "$@"
    dest: /usr/local/bin/xdg-open
    mode: "0755"
  become: true
