---
# Bitwarden desktop: official .deb (there's no apt repo). Kept for the full vault UI; SSH
# and git signing go through rbw's agent (below), not this app. Updates: the in-app
# updater, or rerun with bitwarden_update=true.
- name: Install Bitwarden's undeclared dependencies
  ansible.builtin.apt:
    name: [curl, ca-certificates, libasound2t64, libnss3, libgbm1, libgtk-3-0t64, libxss1,
           libsecret-1-0, libnotify4, xdg-utils]
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

- name: Check for Bitwarden
  ansible.builtin.command: dpkg-query -W -f=${db:Status-Status} bitwarden
  register: apx_bitwarden_pkg
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install Bitwarden
  when: apx_bitwarden_pkg.stdout != 'installed' or bitwarden_update | default(false) | bool
  block:
    - name: Download the Bitwarden .deb
      ansible.builtin.get_url:
        url: https://vault.bitwarden.com/download/?app=desktop&platform=linux&variant=deb
        dest: /tmp/bitwarden.deb
        mode: "0644"
        force: true

    - name: Install the Bitwarden .deb
      ansible.builtin.apt:
        deb: /tmp/bitwarden.deb
      become: true
      when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

- name: Copy the Bitwarden icon to the host
  ansible.builtin.copy:
    src: /usr/share/icons/hicolor/256x256/apps/bitwarden.png
    dest: "{{ local_home }}/.local/share/icons/hicolor/256x256/apps/bitwarden.png"
    remote_src: true
    mode: "0644"

# Quick access (fork of rbw-quick-access, a 1Password-style search over the vault, run from
# its checkout by ~/.local/bin/rbw-quick-access). It needs rbw 1.14+ for `search --raw`;
# Ubuntu ships 1.13, so use the upstream static build.
- name: Install quick access dependencies
  ansible.builtin.apt:
    name: [git, python3-pyqt6, python3-pydantic, python3-platformdirs, pinentry-qt, libsecret-tools]
  become: true
  when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

# The launcher runs src/main.py straight from this checkout
- name: Clone the rbw-quick-access fork
  ansible.builtin.shell: >-
    git clone {{ rbw_quick_access_repo }} {{ rbw_quick_access_checkout }} &&
    git -C {{ rbw_quick_access_checkout }} remote add upstream {{ rbw_quick_access_upstream }}
  args:
    creates: "{{ rbw_quick_access_checkout }}/src/main.py"

- name: Remove Ubuntu's older rbw
  ansible.builtin.apt:
    name: rbw
    state: absent
  become: true
  when: apx_python3_apt.stdout == 'installed' or not ansible_check_mode

- name: Check the installed rbw version
  ansible.builtin.command: /usr/local/bin/rbw --version
  register: apx_rbw_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install rbw {{ rbw_version }}
  ansible.builtin.unarchive:
    src: https://github.com/doy/rbw/releases/download/{{ rbw_version }}/rbw_{{ rbw_version }}_linux_amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include: [rbw, rbw-agent]
    mode: "0755"
  become: true
  when: apx_rbw_version.stdout != 'rbw ' ~ rbw_version

# Prompts go through pinentry-keyring, which answers the master password from the GNOME login
# keyring (stored the first time it's typed into pinentry-qt), so unlocking needs no typing.
# The long lock timeout keeps rbw-agent unlocked until it stops (reboot).
- name: Install the keyring-backed pinentry
  ansible.builtin.copy:
    src: pinentry-keyring
    dest: /usr/local/bin/pinentry-keyring
    mode: "0755"
  become: true

# The email is set by hand along with `rbw login` (see README)
- name: Configure rbw
  ansible.builtin.command: rbw config set {{ item.key }} {{ item.value }}
  loop:
    - { key: pinentry, value: pinentry-keyring }
    - { key: lock_timeout, value: "2592000" }
  changed_when: false
