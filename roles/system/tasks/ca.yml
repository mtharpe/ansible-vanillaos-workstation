# The CA certificate isn't kept in this repo: it's a gitignored file next to vars/vars.yml
# (copy it there from Bitwarden). Skipped when it's missing.
- name: Look for the CA certificate
  ansible.builtin.stat:
    path: "{{ system_ca_path }}"
  register: system_ca_file

- name: Warn that the CA is missing
  ansible.builtin.debug:
    msg: "{{ system_ca_path }} not found; the home CA was not installed"
  when: not system_ca_file.stat.exists

- name: Install the CA
  when: system_ca_file.stat.exists
  block:
    # Host trust store. /usr/local is /var/usrlocal: writable and kept across ABRoot updates.
    - name: Install the CA into the host trust store
      ansible.builtin.copy:
        src: "{{ system_ca_path }}"
        dest: /usr/local/share/ca-certificates/{{ custom_ca_cert | regex_replace('\.(pem|crt)$', '') }}.crt
        owner: root
        group: root
        mode: "0644"
      notify: Update CA certificates

    # Qt Flatpaks (e.g. Nextcloud) ignore SSL_CERT_FILE and only search hashed cert dirs; the
    # sandbox's /opt/openssl/certs maps to host /var/opt/openssl/certs.
    - name: Compute the CA subject hash
      ansible.builtin.command: openssl x509 -hash -noout -in {{ system_ca_path }}
      register: system_ca_hash
      changed_when: false
      check_mode: false

    - name: Install the CA for Qt Flatpaks
      ansible.builtin.copy:
        src: "{{ system_ca_path }}"
        dest: /var/opt/openssl/certs/{{ system_ca_hash.stdout }}.0
        owner: root
        group: root
        mode: "0644"
