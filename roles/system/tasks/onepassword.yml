# 1Password runs on the host, not in an apx subsystem: its system authentication unlock
# refuses the host's system D-Bus as seen from a rootless container (owned by "nobody").
# 1password-host-update installs the signed tarball in /opt/1Password and op in /usr/local,
# does the packages' post-install work, and a weekly timer keeps both current.
- name: Install the 1Password updater
  ansible.builtin.copy:
    src: onepassword/1password-host-update
    dest: /usr/local/sbin/1password-host-update
    owner: root
    group: root
    mode: "0755"

- name: Install the 1Password updater units
  ansible.builtin.copy:
    src: onepassword/{{ item }}
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - 1password-host-update.service
    - 1password-host-update.timer

- name: Install or update 1Password
  ansible.builtin.command: /usr/local/sbin/1password-host-update
  register: system_onepassword_update
  changed_when: "'Installing ' in system_onepassword_update.stdout"

- name: Enable the weekly 1Password update
  ansible.builtin.systemd_service:
    name: 1password-host-update.timer
    enabled: true
    state: started
    daemon_reload: true

# System authentication unlock and the CLI/SSH agent approvals ask polkit for these
# actions; the tarball's policy would go to /usr/share, which is read-only here, but
# polkitd also reads /usr/local/share/polkit-1/actions.
- name: Install the 1Password polkit policy
  ansible.builtin.template:
    src: com.1password.1Password.policy.j2
    dest: /usr/local/share/polkit-1/actions/com.1password.1Password.policy
    owner: root
    group: root
    mode: "0644"
  notify: Restart polkit
