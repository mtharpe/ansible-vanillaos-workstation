# 1Password's system authentication unlock and its CLI/SSH agent approvals ask polkit for
# these actions. The .deb puts the policy in the subsystem's /usr/share, which the host's
# polkitd never sees; it reads /usr/local/share/polkit-1/actions too.
- name: Install the 1Password polkit policy
  ansible.builtin.template:
    src: com.1password.1Password.policy.j2
    dest: /usr/local/share/polkit-1/actions/com.1password.1Password.policy
    owner: root
    group: root
    mode: "0644"
  notify: Restart polkit
