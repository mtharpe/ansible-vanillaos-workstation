# The host is driven locally (run.sh runs on it). The apx subsystems are rootless podman
# containers, reached with `podman exec` as the desktop user (sudo inside is passwordless).
all:
  children:
    workstation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
    apx:
      vars:
        ansible_connection: containers.podman.podman
        ansible_user: "{{ local_user }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_become_method: ansible.builtin.sudo
      children:
        apx_claude:
          hosts:
            apx-claude-work:
            apx-claude-personal:
        apx_bitwarden:
          hosts:
            apx-bitwarden:
        # Shares the host $HOME
        apx_ansible:
          hosts:
            apx-ansible:
        # Created by Vanilla OS itself; holds the terminal's tmux
        apx_vso:
          hosts:
            apx-vso-native:
        # Get the DevOps toolset (devops_tools)
        apx_dev:
          children:
            apx_claude:
            apx_ansible:
            apx_vso:
