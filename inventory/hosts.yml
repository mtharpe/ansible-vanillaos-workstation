# The host is driven locally (run.sh runs on it). The apx subsystems aren't listed here:
# apx.podman_containers.yml finds every container apx made, so a new one is covered as soon
# as it exists.
all:
  children:
    workstation:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
