---
# Copy to vars/vars.yml (gitignored) and adjust.
local_user: tharpem
local_home: /home/{{ local_user }}

# Twingate accounts for the `twingate work|personal` launcher (email or email:network)
twingate_accounts:
  work: you@work.example:worknetwork      # email:network, as `twingate account list` shows it
  personal: you@example.com:yournetwork  # the account must have signed in once (`twingate add`)

# Home CA trusted by the host, Qt Flatpaks and (manually, see README) Flatpak Chrome.
# Put the certificate itself in vars/ (gitignored, kept in Bitwarden); skipped if missing.
custom_ca_cert: axis.lan-ca.crt

# Static CLI tools in ~/.local/bin, pinned. member = path of the binary inside the archive.
cli_tools:
  - name: eza
    version: 0.23.5
    url: https://github.com/eza-community/eza/releases/download/v0.23.5/eza_x86_64-unknown-linux-musl.tar.gz
    member: eza
  - name: rg
    version: 15.2.0
    url: https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
    member: ripgrep-15.2.0-x86_64-unknown-linux-musl/rg
  - name: bat
    version: 0.26.1
    url: https://github.com/sharkdp/bat/releases/download/v0.26.1/bat-v0.26.1-x86_64-unknown-linux-musl.tar.gz
    member: bat-v0.26.1-x86_64-unknown-linux-musl/bat
  - name: fzf
    version: 0.74.5
    url: https://github.com/junegunn/fzf/releases/download/v0.74.5/fzf-0.74.5-linux_amd64.tar.gz
    member: fzf
  - name: zoxide
    version: 0.10.0
    url: https://github.com/ajeetdsouza/zoxide/releases/download/v0.10.0/zoxide-0.10.0-x86_64-unknown-linux-musl.tar.gz
    member: zoxide
  - name: fd
    version: 10.5.0
    url: https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-musl.tar.gz
    member: fd-v10.5.0-x86_64-unknown-linux-musl/fd
  - name: btop
    version: 1.4.7
    url: https://github.com/aristocratos/btop/releases/download/v1.4.7/btop-x86_64-unknown-linux-musl.tar.gz
    member: btop/bin/btop
  - name: lazygit
    version: 0.66.2
    url: https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_x86_64.tar.gz
    member: lazygit
  - name: delta
    version: 0.20.1
    url: https://github.com/dandavison/delta/releases/download/0.20.1/delta-0.20.1-x86_64-unknown-linux-musl.tar.gz
    member: delta-0.20.1-x86_64-unknown-linux-musl/delta
  # mikefarah's yq (the apt yq is a jq wrapper)
  - name: yq
    version: 4.54.1
    url: https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64.tar.gz
    member: yq_linux_amd64
  - name: k9s
    version: 0.51.0
    url: https://github.com/derailed/k9s/releases/download/v0.51.0/k9s_Linux_amd64.tar.gz
    member: k9s

nerd_fonts_version: v3.5.1
nerd_fonts: [JetBrainsMono, FiraCode, Hack, Meslo, CascadiaCode]

flatpak_apps:
  - com.google.Chrome
  - com.mattjakeman.ExtensionManager
  - com.nextcloud.desktopclient.nextcloud
  - com.slack.Slack
  - com.usebottles.bottles
  - net.nokyan.Resources
  - org.gnome.Boxes
  - be.alexandervanhee.gradia
  - io.github.maniacx.BudsLink
  - org.onlyoffice.desktopeditors
  - us.zoom.Zoom

# Installed from extensions.gnome.org when missing (twingate-panel is handled separately)
gnome_extensions_ego:
  - appindicatorsupport@rgcjonas.gmail.com
  - just-perfection-desktop@just-perfection

gnome_enabled_extensions:
  - vso@vanillaos.org
  - auto-move-windows@gnome-shell-extensions.gcampax.github.com
  - just-perfection-desktop@just-perfection
  - user-theme@gnome-shell-extensions.gcampax.github.com
  - system-monitor@gnome-shell-extensions.gcampax.github.com
  - appindicatorsupport@rgcjonas.gmail.com
  - twingate-panel@mtharpe
  - quiet-screenshots@mtharpe

# Dev checkout to symlink as the extension; if it doesn't exist, main is downloaded instead
twingate_panel_checkout: "{{ local_home }}/src/github/mtharpe/twingate-panel"
twingate_panel_tarball: https://codeload.github.com/mtharpe/twingate-panel/tar.gz/refs/heads/main

gnome_custom_keybindings:
  - name: Terminal
    command: ptyxis --new-window
    binding: <Super>t
  # Only with password_manager: bitwarden
  - name: Bitwarden
    command: "{{ local_home }}/.local/bin/bitwarden-desktop"
    binding: <Control><Alt><Shift>space
    password_manager: bitwarden
  - name: Edit last screenshot
    command: "{{ local_home }}/.local/bin/screenshot-edit"
    binding: <Shift><Alt>5
  # Quick access for password_manager. Wayland gives apps no global shortcuts, so GNOME
  # opens 1Password's Quick Access, or the rbw-quick-access window
  - name: Quick access
    command: "{{ local_home }}/.local/bin/{{ '1password-desktop --quick-access' if password_manager == '1password' else 'rbw-quick-access' }}"
    binding: <Control><Shift>space
  # The dock's MST monitors sometimes stay dark after the screens power off
  - name: Reset dock monitors
    command: "{{ local_home }}/.local/bin/displays-reset"
    binding: <Super><Alt>d
  - name: Reset dock monitors (hard)
    command: "{{ local_home }}/.local/bin/displays-reset --hard"
    binding: <Super><Alt><Shift>d
  # The keyboard's screenshot key (F8) sends Super+Shift+S, the Windows snip shortcut:
  # take a screenshot, then edit it in Gradia
  - name: Screenshot and edit
    command: "{{ local_home }}/.local/bin/screenshot-capture-edit"
    binding: <Shift><Super>s

# Standalone web apps from github.com/mtharpe/electron-apps, built in apx-vso-native
electron_apps_repo: https://github.com/mtharpe/electron-apps.git
electron_apps_checkout: "{{ local_home }}/src/github/mtharpe/electron-apps"
electron_apps: [gmail, google-calendar, google-tasks, google-keep, google-messages, messenger]


# rbw (Bitwarden CLI) for quick access, in apx-bitwarden (password_manager: bitwarden)
rbw_quick_access_repo: https://github.com/mtharpe/rbw-quick-access.git
rbw_quick_access_upstream: https://git.forgeserv.cloud/oitsjustjose/rbw-quick-access
rbw_quick_access_checkout: "{{ local_home }}/src/github/mtharpe/rbw-quick-access"
rbw_version: 1.15.0

# Google Geolocation API key (Cloud console: enable "Geolocation API", create an API key
# restricted to it) for timezone-on-wake, which sets the time zone from the nearby Wi-Fi
# after every wake. Empty: BeaconDB only, which has no data in some places.
google_geolocation_api_key: ""

# Password manager for SSH keys, git signing and Ctrl+Shift+Space quick access:
#   1password  1Password's SSH agent and Quick Access (on the host); Bitwarden is a client only
#   bitwarden  rbw's SSH agent and the rbw-quick-access fork (apx-bitwarden); rbw is logged in
#              by hand (README)
# With bitwarden, add its subsystem to apx_subsystems
#   (- name: bitwarden, home: "{{ local_home }}/.apx-homes/bitwarden"). Switching: re-run ./run.sh user containers, then
# log out and back in.
password_manager: 1password

# apx subsystems: name -> custom home (no home: shares the host $HOME)
apx_subsystems:
  - name: claude-work
    home: "{{ local_home }}/.apx-homes/claude-work"
  - name: claude-personal
    home: "{{ local_home }}/.apx-homes/claude-personal"
  - name: ansible

# Bluetooth headsets: WirePlumber codec profile and latency offset (ms, may be negative) that keep
# Chrome video in sync. address is the Bluetooth MAC (bluetoothctl devices); route is the output
# route name (default headset-output)
bt_audio_devices:
  - name: Pixel Buds Pro 2
    address: "XX:XX:XX:XX:XX:XX"
    profile: a2dp-sink-sbc
    latency_offset_ms: -100
